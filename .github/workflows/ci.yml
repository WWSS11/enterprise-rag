name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check third-party licenses
        run: python scripts/check_licenses.py

      - name: Run Ruff
        run: python -m ruff check app tests migrations scripts

      - name: Run mypy
        run: python -m mypy app

      - name: Run pytest
        run: python -m pytest --junitxml=test-results/backend/pytest.xml

      - name: Upload backend test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-results
          path: test-results/backend/pytest.xml
          if-no-files-found: ignore
          retention-days: 7

  database-migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_POSTGRES_DSN: postgresql+asyncpg://rag_ci:rag_ci@localhost:5432/rag_ci
      APP_POSTGRES_SYNC_DSN: postgresql+psycopg://rag_ci:rag_ci@localhost:5432/rag_ci

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rag_ci
          POSTGRES_PASSWORD: rag_ci
          POSTGRES_DB: rag_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_ci -d rag_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Upgrade an empty database to head
        run: python -m alembic upgrade head

      - name: Verify the database is at head
        run: python -m alembic current --check-heads

      - name: Verify an existing database can move backward and forward
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python -m alembic current --check-heads

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest
        run: npm run test

      - name: Build frontend
        run: npm run build

  deterministic-e2e:
    name: Deterministic browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium, Firefox, and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run deterministic Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pip-audit
          python -m pip_audit --strict --vulnerability-service osv

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm run audit:ci

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Scan tracked text files
        run: python scripts/check_secrets.py

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze source
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
          upload: never

      - name: Upload CodeQL SARIF
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-results
          if-no-files-found: error
          retention-days: 7
