[build-system]
requires = ["setuptools>=80.9.0", "wheel>=0.46.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-study-helper-enterprise"
version = "0.1.0"
description = "Enterprise RAG service built with FastAPI, LangChain, LangGraph, Milvus, PostgreSQL, Redis and Celery"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.139.0",
  "uvicorn[standard]==0.51.0",
  "langchain==1.3.12",
  "langchain-core==1.4.9",
  "langchain-openai==1.3.4",
  "langgraph==1.2.9",
  "langchain-text-splitters==1.1.2",
  "pymilvus==2.6.16",
  "SQLAlchemy==2.0.51",
  "alembic==1.18.5",
  "asyncpg==0.31.0",
  "psycopg[binary]==3.3.4",
  "redis==6.4.0",
  "celery[redis]==5.6.3",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "httpx==0.28.1",
  "python-multipart>=0.0.22,<1.0",
  "orjson>=3.11,<4.0",
  "structlog>=25.5,<26.0",
  "tenacity>=9.1,<10.0",
  "pypdf>=6.14,<7.0",
  "python-docx>=1.2,<2.0",
  "python-pptx==1.0.2",
  "beautifulsoup4>=4.14,<5.0",
  "openpyxl>=3.1,<4.0",
  "xlrd==2.0.2",
  "defusedxml>=0.7.1,<1.0",
  "prometheus-client==0.25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10.0",
  "pytest-asyncio>=1.3,<2.0",
  "httpx==0.28.1",
  "ruff>=0.14,<1.0",
  "mypy>=1.19,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["celery.*", "defusedxml.*", "openpyxl.*", "pptx.*", "pymilvus.*", "xlrd.*"]
ignore_missing_imports = true
